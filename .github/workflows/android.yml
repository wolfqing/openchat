name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openchat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # What the two jobs above cannot see. v0.6.0 passed both and crashed on launch: only the
  # release build runs R8, and R8 had shrunk code whose Kotlin metadata it could not read.
  # Lint errors went unnoticed for a month for the same reason: nothing ran lint.
  release:
    name: Lint and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      # No keystore here, so this is signed with the debug key: it checks the build, it is not a release.
      - name: Assemble release APK (R8)
        shell: bash
        run: ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee release-build.log

      - name: R8 must understand the Kotlin metadata
        shell: bash
        run: |
          if grep -i "kotlin metadata" release-build.log; then
            echo "::error::R8 could not read Kotlin metadata; the shrunk APK may crash on launch. Raise the pinned R8 in android/build.gradle.kts."
            exit 1
          fi
